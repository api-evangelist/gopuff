apis:
- aid: gopuff:storefronts-api
  name: Powered by Gopuff Storefronts API
  description: >
    Storefronts Powered by Gopuff is a customizable Shopify theme integrated with Gopuff's catalog and
    delivery

    APIs that enables brands to launch a white-labeled DTC website with built-in 15-minute delivery from
    a

    Gopuff MFC. The same partner platform exposes three documented integration calls: a delivery-zone
    check

    invoked when a customer enters their address, a per-MFC inventory-availability lookup driven by SKU/UPC

    mapping, and an order-routing call that hands the completed checkout to the nearest MFC for fulfillment.

    Public reference docs are not yet published; only the operational contract documented in the partner
    help

    portal is available.
  humanURL: https://poweredby.gopuff.com/pages/storefronts
